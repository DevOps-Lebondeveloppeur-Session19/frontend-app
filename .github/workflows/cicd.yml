name: CI/CD frontend-api

on:
  push:
    branches: [ "main" ]


env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:${{ github.run_number }}


jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name : build docker image
      run: docker build -t ${{ env.IMAGE_NAME }} -build-arg VITE_API_URL=https://api.150.lebondeveloppeur.net  .

    - name: Login to Docker Hub
      uses: docker/login-action@v3 
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image 
      run: docker push ${{ env.IMAGE_NAME }}


  deploy-job:

    runs-on: ubuntu-latest

    needs: build-and-push  

    steps:

      - name: Connect to the VPS using SSH
        uses: appleboy/ssh-action@master # master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |

              # Pull the latest Docker image
              sudo docker pull ${{ env.IMAGE_NAME }}
              
              # Remove the old container if it exists
              sudo docker rm -f frontend-app 

              sudo docker run -d \
              -p 3002:80 \
              --name frontend-app \
              --restart always \
              ${{ env.IMAGE_NAME }}


              # Shows running containersss
              sudo docker ps

